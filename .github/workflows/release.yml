name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron runtime
        shell: pwsh
        run: |
          if (-not (Test-Path node_modules/electron/dist/electron.exe)) {
            node node_modules/electron/install.js
          }
          Test-Path node_modules/electron/dist/electron.exe

      - name: Build installers
        run: npm run dist

      - name: Build portable zip
        run: npm run pack:portable

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash release/*.exe, release/*.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content release/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*-Setup.exe
            release/*-portable.zip
            release/SHA256SUMS.txt
          draft: true
